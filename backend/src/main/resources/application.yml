server:
  # 开发期固定端口：前端 vite proxy（frontend/vite.config.ts）指向这里，两边必须一致。
  # 不用 8080 是因为本机 nginx 占着它。
  # 打包成 exe 后这个值不生效 —— 桌面壳用命令行参数 --server.port=<随机空闲端口> 覆盖。
  port: 8081
  address: 127.0.0.1

spring:
  application:
    name: detective-helper

  datasource:
    # ${detectivehelper.data.dir} 由 DataDirEnvironmentPostProcessor 在数据源创建之前
    # 写成绝对路径。默认值 ./data 只在「IDE 里单独跑 backend」时兜底。
    # 注意 SQLite 不会创建父目录，所以那个 PostProcessor 是必须的，不是可选的。
    url: jdbc:sqlite:${detectivehelper.data.dir:./data}/detective-helper.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者模型：连接池大于 1 只会制造 SQLITE_BUSY
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA foreign_keys = ON;"
      pool-name: detective-helper-pool

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  web:
    resources:
      # 关掉 Spring Boot 自带的静态资源规则，交给 WebConfig 统一处理。
      # 否则 Boot 也会注册一套 /** → classpath:/static/，和我们的 SPA 回退规则打架。
      add-mappings: false

mybatis:
  configuration:
    # cover_type → coverType、canvas_data → canvasData。没有它就只有 id/name 能自动映射
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

detective-helper:
  app:
    name: Detective Helper
    # 构建时由 spring-boot-starter-parent 的资源过滤替换成真实版本号
    version: '@project.version@'
  storage:
    data-dir: ${detectivehelper.data.dir:./data}

logging:
  level:
    root: INFO
    com.theos.detectivehelper: INFO
    # 原来是 DEBUG：每次请求刷几十行 SQL，冷启动还会明显变慢
    org.springframework.jdbc: WARN
    org.mybatis: WARN
