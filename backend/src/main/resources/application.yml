server:
  # 固定端口：前端 vite proxy 指向 localhost:8081（见 frontend/vite.config.ts）
  # 这里与 proxy target 必须保持一致，不能再设为 0（随机端口）。
  # 不用 8080 是因为本机 nginx 已占用该端口。
  port: 8081

spring:
  application:
    name: detective-helper-backend
  datasource:
    url: jdbc:sqlite:./data/detective-helper.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA foreign_keys = ON;"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    com.theos.detectivehelper: INFO
    org.springframework.jdbc: DEBUG

app:
  name: Detective Helper
  version: 1.0.0
  upload-path: ./data/uploads
  max-file-size: 20MB